<header class="topbar">
  <a routerLink="/spectacles" class="brand">Theatre Archi</a>

  <nav class="menu">
    <a routerLink="/spectacles" routerLinkActive="active">Spectacles</a>
    <a routerLink="/reservations" routerLinkActive="active">Mes reservations</a>
  </nav>

  <div class="session">
    <span *ngIf="!authEnabled" class="mode-badge">Mode demo (auth desactivee)</span>

    <ng-container *ngIf="session() as currentSession; else loggedOut">
      <span class="user-email">{{ currentSession.user.email }}</span>
      <button type="button" class="logout" (click)="logout()">Se deconnecter</button>
    </ng-container>

    <ng-template #loggedOut>
      <a *ngIf="authEnabled" routerLink="/login" class="auth-link">Connexion</a>
      <a *ngIf="authEnabled" routerLink="/register" class="auth-link">Inscription</a>
    </ng-template>
  </div>
</header>

<main class="page-container">
  <router-outlet></router-outlet>
</main>
