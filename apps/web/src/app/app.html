<header class="topbar" data-testid="header">
  <a routerLink="/spectacles" class="brand" data-testid="header-brand">Theatre Archi</a>

  <nav class="menu" data-testid="header-menu">
    <a routerLink="/spectacles" routerLinkActive="active" data-testid="nav-spectacles-link">Spectacles</a>
    <a
      routerLink="/reservations"
      routerLinkActive="active"
      data-testid="nav-reservations-link"
    >
      Mes reservations
    </a>
  </nav>

  <div class="session" data-testid="session-container">
    <span *ngIf="!authEnabled" class="mode-badge" data-testid="session-mode-badge">
      Mode demo (auth desactivee)
    </span>

    <ng-container *ngIf="session() as currentSession; else loggedOut">
      <span class="user-email" data-testid="session-user-email">{{ currentSession.user.email }}</span>
      <button type="button" class="logout" (click)="logout()" data-testid="logout-button">Se deconnecter</button>
    </ng-container>

    <ng-template #loggedOut>
      <a *ngIf="authEnabled" routerLink="/login" class="auth-link" data-testid="header-login-link">Connexion</a>
      <a *ngIf="authEnabled" routerLink="/register" class="auth-link" data-testid="header-register-link">Inscription</a>
    </ng-template>
  </div>
</header>

<main class="page-container">
  <router-outlet></router-outlet>
</main>
