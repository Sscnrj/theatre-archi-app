<section class="detail">
  <p *ngIf="isLoading">Chargement...</p>

  <p class="error" *ngIf="!isLoading && error">{{ error }}</p>

  <ng-container *ngIf="!isLoading && !error && show">
    <div class="header">
      <img class="detail-image" [src]="imageSrc" [alt]="show.titre" />

      <div class="header-content">
        <h1>{{ show.titre }}</h1>
        <p class="desc">{{ show.description }}</p>

        <div class="info">
          <div class="line">
            <strong>Date :</strong>
            <span>{{ formatDate(show.date_spectacle) }}</span>
          </div>

          <div class="line">
            <strong>Prix :</strong>
            <span>{{ show.prix }} €</span>
          </div>

          <div class="line">
            <strong>Places restantes :</strong>
            <span>{{ show.nb_places_restantes }} / {{ show.nb_places_total }}</span>
          </div>
        </div>

        <button (click)="reserve()" [disabled]="show.nb_places_restantes <= 0">
          Réserver
        </button>
      </div>
    </div>
  </ng-container>
</section>
