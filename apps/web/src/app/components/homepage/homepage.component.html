<section class="homepage">
  <h1>Spectacles</h1>

  <div class="toolbar">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Rechercher par titre..."
      aria-label="Rechercher"
    />

    <select [(ngModel)]="sortBy" aria-label="Trier">
      <option value="date">Trier par date</option>
      <option value="titre">Trier par titre</option>
      <option value="prix">Trier par prix</option>
    </select>
  </div>

  <p *ngIf="isLoading">Chargement...</p>
  <p class="error" *ngIf="!isLoading && error">{{ error }}</p>

  <p *ngIf="!isLoading && !error && filteredShows.length === 0">
    Aucun spectacle trouvé.
  </p>

  <div class="grid" *ngIf="!isLoading && !error && filteredShows.length > 0">
    <app-show-card
      *ngFor="let s of filteredShows; trackBy: trackById"
      [show]="s"
    ></app-show-card>
  </div>
</section>
