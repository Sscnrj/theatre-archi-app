<section class="page" data-testid="spectacles-page">
  <h1 data-testid="spectacles-title">Spectacles disponibles</h1>

  <p *ngIf="isLoading" data-testid="spectacles-loading">Chargement...</p>
  <p *ngIf="errorMessage" class="error" data-testid="spectacles-error">{{ errorMessage }}</p>

  <div class="grid" *ngIf="!isLoading && !errorMessage" data-testid="spectacles-grid">
    <article class="card" *ngFor="let spectacle of spectacles; trackBy: trackById" data-testid="spectacle-card">
      <img
        *ngIf="spectacle.imageUrl"
        [src]="spectacle.imageUrl"
        [alt]="spectacle.titre"
        loading="lazy"
        data-testid="spectacle-image"
      />
      <h2 data-testid="spectacle-title">{{ spectacle.titre }}</h2>
      <p data-testid="spectacle-description">{{ spectacle.description }}</p>
      <p data-testid="spectacle-date"><strong>Date:</strong> {{ spectacle.dateSpectacle | date: 'medium' }}</p>
      <p data-testid="spectacle-price">
        <strong>Prix:</strong> {{ spectacle.prix | currency: 'EUR' : 'symbol' : '1.2-2' }}
      </p>
      <a [routerLink]="['/spectacles', spectacle.id]" data-testid="spectacle-detail-link">Voir le detail</a>
    </article>
  </div>
</section>
