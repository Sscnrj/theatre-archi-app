<section class="page" data-testid="spectacle-detail-page">
  <a routerLink="/spectacles" class="back-link" data-testid="spectacle-back-link">← Retour a la liste</a>

  <p *ngIf="isLoading" data-testid="spectacle-detail-loading">Chargement...</p>
  <p *ngIf="errorMessage" class="error" data-testid="spectacle-detail-error">{{ errorMessage }}</p>

  <article class="card" *ngIf="spectacle && !isLoading" data-testid="spectacle-detail-card">
    <img
      *ngIf="spectacle.imageUrl"
      [src]="spectacle.imageUrl"
      [alt]="spectacle.titre"
      data-testid="spectacle-detail-image"
    />
    <h1 data-testid="spectacle-detail-title">{{ spectacle.titre }}</h1>
    <p data-testid="spectacle-detail-description">{{ spectacle.description }}</p>
    <p data-testid="spectacle-detail-date"><strong>Date:</strong> {{ spectacle.dateSpectacle | date: 'medium' }}</p>
    <p data-testid="spectacle-detail-price">
      <strong>Prix:</strong> {{ spectacle.prix | currency: 'EUR' : 'symbol' : '1.2-2' }}
    </p>

    <form [formGroup]="reservationForm" (ngSubmit)="reserve()" data-testid="reservation-form">
      <label>
        Nombre de places
        <input
          type="number"
          min="1"
          formControlName="nombrePlaces"
          data-testid="reservation-nombre-places"
        />
      </label>
      <small
        *ngIf="reservationForm.controls.nombrePlaces.invalid && reservationForm.controls.nombrePlaces.touched"
        data-testid="reservation-nombre-places-error"
      >
        La quantite doit etre superieure a 0.
      </small>

      <button type="submit" [disabled]="isSubmitting" data-testid="reservation-submit">
        {{ isSubmitting ? 'Reservation...' : 'Reserver' }}
      </button>
    </form>

    <p *ngIf="successMessage" class="success" data-testid="reservation-success">{{ successMessage }}</p>
  </article>
</section>
