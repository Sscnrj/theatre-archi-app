databaseChangeLog:
  - changeSet:
      id: 1
      author: lucas
      changes:
        - createTable:
            tableName: utilisateur
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: nom
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: mot_de_passe
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(50)

  - changeSet:
      id: 2
      author: lucas
      changes:
        - createTable:
            tableName: spectacle
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: titre
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: date
                  type: TIMESTAMP
              - column:
                  name: prix
                  type: NUMERIC(10,2)
              - column:
                  name: image_url
                  type: VARCHAR(255)

  - changeSet:
      id: 3
      author: lucas
      changes:
        - createTable:
            tableName: reservation
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: utilisateur_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: spectacle_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: nombre_billets
                  type: INT
              - column:
                  name: montant_total
                  type: NUMERIC(10,2)
              - column:
                  name: date_reservation
                  type: TIMESTAMP
