  - changeSet:
      id: 004-seed-fake-reservations
      author: copilot
      preConditions:
        onFail: MARK_RAN
        and:
          - sqlCheck:
              expectedResult: "12"
              sql: "SELECT COUNT(*) FROM spectacles WHERE titre LIKE '[FAKE] %';"
          - sqlCheck:
              expectedResult: "0"
              sql: "SELECT COUNT(*) FROM reservations WHERE user_id LIKE 'fake-user-%';"
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              WITH fake_spectacles AS (
                SELECT id, prix, ROW_NUMBER() OVER (ORDER BY id) AS rn
                FROM spectacles
                WHERE titre LIKE '[FAKE] %'
                ORDER BY id
                LIMIT 12
              ),
              generated AS (
                SELECT
                  gs AS seq,
                  ((gs - 1) % 30) + 1 AS user_seq,
                  ((gs - 1) % 12) + 1 AS spectacle_seq,
                  CASE WHEN gs % 3 = 0 THEN 'PAID' ELSE 'CREATED' END AS status
                FROM generate_series(1, 120) gs
              )
              INSERT INTO reservations (
                spectacle_id,
                user_id,
                user_email,
                nombre_places,
                montant_total,
                date_reservation,
                status
              )
              SELECT
                fs.id,
                format('fake-user-%s', LPAD(g.user_seq::text, 3, '0')),
                format('fake.user.%s@example.test', LPAD(g.user_seq::text, 3, '0')),
                2,
                ROUND((fs.prix * 2)::numeric, 2)::double precision,
                NOW() - ((g.seq % 180) || ' days')::interval,
                g.status
              FROM generated g
              JOIN fake_spectacles fs
                ON fs.rn = g.spectacle_seq;
