name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: theatre
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d theatre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            services/auth-service/package-lock.json
            services/payment-service/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Install auth-service dependencies
        run: npm ci --prefix services/auth-service

      - name: Install payment-service dependencies
        run: npm ci --prefix services/payment-service

      - name: Apply backend Liquibase migrations
        run: cd apps/backend && mvn -q resources:resources liquibase:update

      - name: Run backend tests
        run: npm run test:back

      - name: Run frontend integration tests
        run: npm run test:web

      - name: Run auth-service tests
        run: npm run test:auth

      - name: Run payment-service tests
        run: npm run test:payment
